<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Resumatic — Create Account</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <style>
    .auth-wrap {
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 24px;
      position: relative; z-index: 1;
    }
    .auth-card {
      width: 100%; max-width: 420px;
      background: #111620;
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 20px;
      padding: 44px 40px;
    }
    .auth-logo {
      display: flex; align-items: baseline; gap: 1px;
      font-family: 'Syne', sans-serif;
      font-weight: 800; font-size: 1.35rem;
      margin-bottom: 32px;
      text-decoration: none;
    }
    .auth-title {
      font-family: 'Syne', sans-serif;
      font-size: 1.6rem; font-weight: 800;
      margin-bottom: 8px;
    }
    .auth-sub {
      color: #7a8196; font-size: 0.9rem;
      margin-bottom: 32px;
    }
    .auth-field {
      display: flex; flex-direction: column; gap: 6px;
      margin-bottom: 18px;
    }
    .auth-field label {
      font-size: 0.85rem; color: #e8eaf0; font-weight: 500;
    }
    .auth-field input {
      background: #080b10;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px;
      padding: 12px 16px;
      color: #e8eaf0;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }
    .auth-field input:focus { border-color: #7c6ef5; }
    .auth-btn {
      width: 100%;
      background: #7c6ef5;
      color: #fff;
      border: none; border-radius: 100px;
      padding: 13px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.95rem; font-weight: 500;
      cursor: pointer;
      transition: background 0.2s, transform 0.2s;
      margin-top: 8px;
    }
    .auth-btn:hover { background: #a78bfa; transform: translateY(-2px); }
    .auth-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
    .auth-switch {
      text-align: center; margin-top: 24px;
      font-size: 0.875rem; color: #7a8196;
    }
    .auth-switch a { color: #a78bfa; text-decoration: none; }
    .auth-switch a:hover { text-decoration: underline; }
    .auth-alert {
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 0.85rem;
      margin-bottom: 20px;
      display: none;
    }
    .auth-alert.error { background: rgba(248,113,113,0.1); border: 1px solid rgba(248,113,113,0.2); color: #f87171; }
    .auth-alert.success { background: rgba(52,211,153,0.1); border: 1px solid rgba(52,211,153,0.2); color: #34d399; }
  </style>
</head>
<body>
  <div class="noise"></div>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <div class="auth-wrap">
    <div class="auth-card">
      <a href="index.html" class="auth-logo">
        <span class="logo-mark">R</span><span class="logo-text">esumatic</span>
      </a>
      <div class="auth-title">Create account</div>
      <div class="auth-sub">Start building AI-powered resumes today.</div>

      <div class="auth-alert" id="authAlert"></div>

      <div class="auth-field">
        <label for="name">Full Name</label>
        <input type="text" id="name" placeholder="Alex Carter" />
      </div>
      <div class="auth-field">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@email.com" />
      </div>
      <div class="auth-field">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Min. 8 characters" />
      </div>

      <button class="auth-btn" id="signupBtn">Create Account</button>

      <div class="auth-switch">
        Already have an account? <a href="login.html">Sign in</a>
      </div>
    </div>
  </div>

  <script>
    const signupBtn = document.getElementById('signupBtn');
    const alertBox  = document.getElementById('authAlert');

    function showAlert(msg, type) {
      alertBox.textContent = msg;
      alertBox.className   = `auth-alert ${type}`;
      alertBox.style.display = 'block';
    }

    signupBtn.addEventListener('click', async () => {
      const name     = document.getElementById('name').value.trim();
      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (!name || !email || !password) return showAlert('Please fill in all fields.', 'error');
      if (password.length < 8) return showAlert('Password must be at least 8 characters.', 'error');

      signupBtn.disabled = true;
      signupBtn.textContent = 'Creating account…';

      try {
        const res  = await fetch('/api/auth/signup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ name, email, password }),
        });
        const data = await res.json();

        if (!res.ok) return showAlert(data.message, 'error');
        showAlert('Account created! Redirecting…', 'success');
        setTimeout(() => window.location.href = 'form-index.html', 1000);
      } catch (err) {
        showAlert('Something went wrong. Try again.', 'error');
      } finally {
        signupBtn.disabled = false;
        signupBtn.textContent = 'Create Account';
      }
    });
  </script>
</body>
</html>
