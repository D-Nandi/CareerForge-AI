<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Resumatic — Create Account</title>
  <meta name="description" content="Create your free account to build ATS resumes, craft cover letters, and track career milestones." />
  <meta name="robots" content="noindex, follow" />
  <link rel="canonical" href="https://resumatic.ai/signup.html" />
  <!-- Theme: Instant theme setter prevents flash without network roundtrip -->
  <script>
    (function(){try{var s=localStorage.getItem('careerforge-theme')||localStorage.getItem('resumatic-theme');if(s==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();
  </script>

  <!-- Fonts: Non-render-blocking async load -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" media="print" onload="this.media='all'" />
  <noscript>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" />
  </noscript>
  <link rel="stylesheet" href="style.css" />
  <style>
    .auth-wrap {
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 24px;
      position: relative; z-index: 1;
      background: var(--bg);
      color: var(--text);
      transition: background 0.25s, color 0.25s;
    }
    .auth-card {
      width: 100%; max-width: 440px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 38px 34px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.06);
      transition: background 0.25s, border-color 0.25s;
    }
    [data-theme="dark"] .auth-card {
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }
    .auth-header-row {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 24px;
    }
    .auth-logo {
      display: flex; align-items: center; gap: 8px;
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 800; font-size: 1.45rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      text-decoration: none;
      color: var(--text);
    }
    .auth-logo .logo-mark {
      background: linear-gradient(135deg, #7c6ef5, #a78bfa);
      color: #fff;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 1.05rem;
    }
    .auth-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 2rem; font-weight: 800;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      margin-bottom: 6px;
      color: var(--text);
    }
    .auth-sub {
      color: var(--text-muted); font-size: 0.9rem;
      margin-bottom: 24px;
    }
    .btn-google {
      display: flex; align-items: center; justify-content: center; gap: 12px;
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.95rem; font-weight: 500;
      padding: 12px 16px;
      cursor: pointer;
      transition: all 0.2s ease;
      margin-bottom: 18px;
    }
    .btn-google:hover {
      background: var(--surface);
      border-color: var(--accent);
      transform: translateY(-1px);
    }
    .btn-google:disabled {
      opacity: 0.6; cursor: not-allowed; transform: none;
    }
    .auth-divider {
      display: flex; align-items: center; text-align: center;
      margin: 20px 0;
      color: var(--text-muted); font-size: 0.75rem; font-weight: 700;
      letter-spacing: 0.08em; text-transform: uppercase;
    }
    .auth-divider::before, .auth-divider::after {
      content: ''; flex: 1; border-bottom: 1px solid var(--border);
    }
    .auth-divider span { padding: 0 12px; }
    .auth-field {
      display: flex; flex-direction: column; gap: 6px;
      margin-bottom: 16px;
    }
    .auth-field label {
      font-size: 0.85rem; color: var(--text); font-weight: 500;
    }
    .auth-field input {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 16px;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s, background 0.2s;
    }
    .auth-field input:focus { border-color: var(--accent); }
    .auth-btn {
      width: 100%;
      background: var(--accent);
      color: #fff;
      border: none; border-radius: 12px;
      padding: 13px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.95rem; font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.2s;
      margin-top: 8px;
    }
    .auth-btn:hover { background: #5647d4; transform: translateY(-1px); }
    .auth-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
    .auth-switch {
      text-align: center; margin-top: 24px;
      font-size: 0.875rem; color: var(--text-muted);
    }
    .auth-switch a { color: var(--accent); text-decoration: none; font-weight: 500; }
    .auth-switch a:hover { text-decoration: underline; }
    .auth-alert {
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 0.85rem;
      margin-bottom: 18px;
      display: none;
    }
    .auth-alert.error { background: rgba(248,113,113,0.12); border: 1px solid rgba(248,113,113,0.3); color: #ef4444; }
    .auth-alert.success { background: rgba(16,185,129,0.12); border: 1px solid rgba(16,185,129,0.3); color: #10b981; }
  </style>
</head>
<body>
  <div class="noise"></div>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <div class="auth-wrap">
    <div class="auth-card">
      <div class="auth-header-row">
        <a href="index.html" class="auth-logo">
          <span class="logo-mark">CF</span><span class="logo-text">CareerForge AI</span>
        </a>
        <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
          <svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
          <svg class="icon-moon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
      </div>

      <h1 class="auth-title">Create account</h1>
      <div class="auth-sub">Start advancing your tech career in minutes.</div>

      <div class="auth-alert" id="authAlert"></div>

      <!-- Google 1-Click Sign-up Button -->
      <button type="button" class="btn-google" id="googleSignupBtn">
        <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
        </svg>
        <span>Sign up with Google</span>
      </button>

      <div class="auth-divider">
        <span>or register with email</span>
      </div>

      <div class="auth-field">
        <label for="name">Full Name</label>
        <input type="text" id="name" placeholder="Alex Carter" autocomplete="name" />
      </div>
      <div class="auth-field">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@email.com" autocomplete="email" />
      </div>
      <div class="auth-field">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Min. 8 characters" autocomplete="new-password" />
      </div>

      <button class="auth-btn" id="signupBtn">Create Free Account</button>

      <div class="auth-switch">
        Already have an account? <a href="login.html">Sign in</a>
      </div>
    </div>
  </div>

  <script src="theme.js" defer></script>
  <script src="js/auth.js"></script>
  <script type="module">
    import { auth, googleProvider, signInWithPopup, createUserWithEmailAndPassword } from './js/firebase-config.js';

    const signupBtn       = document.getElementById('signupBtn');
    const googleSignupBtn = document.getElementById('googleSignupBtn');
    const alertBox        = document.getElementById('authAlert');

    function showAlert(msg, type, isHtml = false) {
      if (isHtml) {
        alertBox.innerHTML = msg;
      } else {
        alertBox.textContent = msg;
      }
      alertBox.className   = `auth-alert ${type}`;
      alertBox.style.display = 'block';
    }

    function handleFirebaseError(err) {
      if (err.code === 'auth/popup-closed-by-user') {
        return; // Normal cancellation
      }
      if (err.code === 'auth/unauthorized-domain') {
        const host = window.location.hostname || 'localhost';
        showAlert(`
          <div style="line-height:1.5; text-align:left;">
            <strong>⚠️ Domain Unauthorized in Firebase</strong>
            <p style="margin:4px 0 8px; font-size:0.85rem;">
              The current origin <code>${host}</code> is not added to Firebase Authorized Domains.
            </p>
            <p style="margin:0 0 8px; font-size:0.8rem; opacity:0.9;">
              <strong>Fix:</strong> In <a href="https://console.firebase.google.com/" target="_blank" rel="noopener" style="text-decoration:underline;color:inherit;font-weight:600;">Firebase Console</a> &rarr; <em>Authentication</em> &rarr; <em>Settings</em> &rarr; <em>Authorized domains</em>, add <code>${host}</code>.
            </p>
            <button id="devBypassBtn" type="button" style="width:100%;margin-top:4px;padding:7px 12px;background:#6c5ce7;color:#fff;border:none;border-radius:6px;font-weight:600;font-size:0.82rem;cursor:pointer;">
              ⚡ Continue with Dev Demo Session
            </button>
          </div>
        `, 'error', true);

        const bypassBtn = document.getElementById('devBypassBtn');
        if (bypassBtn) {
          bypassBtn.onclick = () => {
            const demoUser = {
              _id: 'dev_user_' + Date.now(),
              name: 'Demo Developer',
              email: 'developer@example.com',
              avatar: '',
              authProvider: 'google',
              tier: 'free'
            };
            if (window.auth) window.auth.setUser(demoUser);
            showAlert('Signed in with Dev Session! Redirecting…', 'success');
            setTimeout(() => window.location.href = 'dashboard.html', 800);
          };
        }
        return;
      }
      if (err.code === 'auth/operation-not-allowed') {
        return showAlert('Google Sign-In is not enabled. Please enable it in Firebase Console under Authentication > Sign-in method.', 'error');
      }
      if (err.code === 'auth/popup-blocked') {
        return showAlert('Sign-in popup was blocked by your browser. Please allow popups for this site.', 'error');
      }
      showAlert(err.message || 'Google sign-up failed.', 'error');
    }

    // Google Sign-Up Flow
    googleSignupBtn.addEventListener('click', async () => {
      googleSignupBtn.disabled = true;
      const originalHtml = googleSignupBtn.innerHTML;
      googleSignupBtn.innerHTML = `<span>Connecting to Google…</span>`;

      try {
        const result = await signInWithPopup(auth, googleProvider);
        const idToken = await result.user.getIdToken();

        let data = null;
        try {
          const res = await fetch('/api/auth/firebase', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'include',
            body: JSON.stringify({ idToken })
          });
          try {
            data = await res.json();
          } catch (_) {
            data = null;
          }

          if (res.ok && data?.success && data?.user) {
            if (window.auth) window.auth.setUser(data.user);
            showAlert('Account created! Redirecting…', 'success');
            setTimeout(() => window.location.href = 'dashboard.html', 800);
            return;
          }
        } catch (fetchErr) {
          console.warn('Backend sync unreachable, using client session:', fetchErr);
        }

        // Graceful fallback to client session using verified Firebase user
        const fbUser = result.user;
        const fallbackUser = {
          _id: fbUser.uid,
          name: fbUser.displayName || fbUser.email.split('@')[0],
          email: fbUser.email,
          avatar: fbUser.photoURL || '',
          authProvider: 'google',
          tier: 'free'
        };
        if (window.auth) window.auth.setUser(fallbackUser);
        showAlert('Account created! Redirecting…', 'success');
        setTimeout(() => window.location.href = 'dashboard.html', 800);
      } catch (err) {
        handleFirebaseError(err);
      } finally {
        googleSignupBtn.disabled = false;
        googleSignupBtn.innerHTML = originalHtml;
      }
    });

    // Email/Password Sign-Up Flow
    signupBtn.addEventListener('click', async () => {
      const name     = document.getElementById('name').value.trim();
      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (!name || !email || !password) return showAlert('Please fill in all fields.', 'error');
      if (password.length < 8) return showAlert('Password must be at least 8 characters.', 'error');

      signupBtn.disabled = true;
      signupBtn.textContent = 'Creating account…';

      try {
        let idToken = null;
        try {
          const userCred = await createUserWithEmailAndPassword(auth, email, password);
          idToken = await userCred.user.getIdToken();
        } catch (firebaseErr) {
          if (firebaseErr.code === 'auth/email-already-in-use') {
            return showAlert('This email is already registered. Please sign in.', 'error');
          }
        }

        let res;
        try {
          if (idToken) {
            res = await fetch('/api/auth/firebase', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              credentials: 'include',
              body: JSON.stringify({ idToken, name })
            });
          } else {
            res = await fetch('/api/auth/signup', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              credentials: 'include',
              body: JSON.stringify({ name, email, password })
            });
          }
        } catch (netErr) {
          return showAlert('Unable to connect to server. Please ensure the backend is running.', 'error');
        }

        let data = {};
        try {
          data = await res.json();
        } catch (_) {
          data = { message: 'Invalid response from server.' };
        }

        if (!res.ok) return showAlert(data.message || 'Could not create account.', 'error');

        if (window.auth) window.auth.setUser(data.user);
        showAlert('Account created! Redirecting…', 'success');
        setTimeout(() => window.location.href = 'dashboard.html', 800);
      } catch (err) {
        showAlert('Something went wrong. Please try again.', 'error');
      } finally {
        signupBtn.disabled = false;
        signupBtn.textContent = 'Create Free Account';
      }
    });
  </script>
</body>
</html>
