<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CareerForge AI — Sign In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <style>
    .auth-wrap {
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 24px;
      position: relative; z-index: 1;
    }
    .auth-card {
      width: 100%; max-width: 420px;
      background: #111620;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 20px;
      padding: 40px 36px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }
    .auth-logo {
      display: flex; align-items: center; gap: 8px;
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 800; font-size: 1.5rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 28px;
      text-decoration: none;
      color: #fff;
    }
    .auth-logo .logo-mark {
      background: linear-gradient(135deg, #7c6ef5, #a78bfa);
      color: #fff;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 1.1rem;
    }
    .auth-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 2rem; font-weight: 800;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      margin-bottom: 6px;
      color: #fff;
    }
    .auth-sub {
      color: #7a8196; font-size: 0.9rem;
      margin-bottom: 24px;
    }
    .btn-google {
      display: flex; align-items: center; justify-content: center; gap: 12px;
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      color: #fff;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.95rem; font-weight: 500;
      padding: 12px 16px;
      cursor: pointer;
      transition: all 0.2s ease;
      margin-bottom: 18px;
    }
    .btn-google:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.25);
      transform: translateY(-1px);
    }
    .btn-google:disabled {
      opacity: 0.6; cursor: not-allowed; transform: none;
    }
    .auth-divider {
      display: flex; align-items: center; text-align: center;
      margin: 20px 0;
      color: #7a8196; font-size: 0.75rem; font-weight: 700;
      letter-spacing: 0.08em; text-transform: uppercase;
    }
    .auth-divider::before, .auth-divider::after {
      content: ''; flex: 1; border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    .auth-divider span { padding: 0 12px; }
    .auth-field {
      display: flex; flex-direction: column; gap: 6px;
      margin-bottom: 16px;
    }
    .auth-field label {
      font-size: 0.85rem; color: #e8eaf0; font-weight: 500;
    }
    .auth-field input {
      background: #080b10;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px;
      padding: 12px 16px;
      color: #e8eaf0;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }
    .auth-field input:focus { border-color: #7c6ef5; }
    .auth-btn {
      width: 100%;
      background: #7c6ef5;
      color: #fff;
      border: none; border-radius: 12px;
      padding: 13px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.95rem; font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.2s;
      margin-top: 8px;
    }
    .auth-btn:hover { background: #8b7ef8; transform: translateY(-1px); }
    .auth-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
    .auth-switch {
      text-align: center; margin-top: 24px;
      font-size: 0.875rem; color: #7a8196;
    }
    .auth-switch a { color: #a78bfa; text-decoration: none; font-weight: 500; }
    .auth-switch a:hover { text-decoration: underline; }
    .auth-alert {
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 0.85rem;
      margin-bottom: 18px;
      display: none;
    }
    .auth-alert.error { background: rgba(248,113,113,0.1); border: 1px solid rgba(248,113,113,0.2); color: #f87171; }
    .auth-alert.success { background: rgba(52,211,153,0.1); border: 1px solid rgba(52,211,153,0.2); color: #34d399; }
  </style>
</head>
<body>
  <div class="noise"></div>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <div class="auth-wrap">
    <div class="auth-card">
      <a href="index.html" class="auth-logo">
        <span class="logo-mark">CF</span><span class="logo-text">CareerForge AI</span>
      </a>
      <div class="auth-title">Welcome back</div>
      <div class="auth-sub">Sign in to your account to continue.</div>

      <div class="auth-alert" id="authAlert"></div>

      <!-- Google 1-Click Sign-in Button -->
      <button type="button" class="btn-google" id="googleLoginBtn">
        <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
        </svg>
        <span>Continue with Google</span>
      </button>

      <div class="auth-divider">
        <span>or sign in with email</span>
      </div>

      <div class="auth-field">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@email.com" autocomplete="email" />
      </div>
      <div class="auth-field">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" />
      </div>

      <button class="auth-btn" id="loginBtn">Sign In</button>

      <div class="auth-switch">
        Don't have an account? <a href="signup.html">Create one for free</a>
      </div>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script type="module">
    import { auth, googleProvider, signInWithPopup, signInWithEmailAndPassword } from './js/firebase-config.js';

    const loginBtn       = document.getElementById('loginBtn');
    const googleLoginBtn = document.getElementById('googleLoginBtn');
    const alertBox       = document.getElementById('authAlert');

    function showAlert(msg, type) {
      alertBox.textContent = msg;
      alertBox.className   = `auth-alert ${type}`;
      alertBox.style.display = 'block';
    }

    // Google Sign-In Flow
    googleLoginBtn.addEventListener('click', async () => {
      googleLoginBtn.disabled = true;
      const originalHtml = googleLoginBtn.innerHTML;
      googleLoginBtn.innerHTML = `<span>Connecting to Google…</span>`;

      try {
        const result = await signInWithPopup(auth, googleProvider);
        const idToken = await result.user.getIdToken();

        const res = await fetch('/api/auth/firebase', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ idToken })
        });
        const data = await res.json();

        if (!res.ok) {
          return showAlert(data.message || 'Authentication failed.', 'error');
        }

        if (window.auth) window.auth.setUser(data.user);
        showAlert('Sign in successful! Redirecting…', 'success');
        setTimeout(() => window.location.href = 'dashboard.html', 800);
      } catch (err) {
        if (err.code !== 'auth/popup-closed-by-user') {
          showAlert(err.message || 'Google sign in failed.', 'error');
        }
      } finally {
        googleLoginBtn.disabled = false;
        googleLoginBtn.innerHTML = originalHtml;
      }
    });

    // Email/Password Sign-In Flow
    loginBtn.addEventListener('click', async () => {
      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (!email || !password) return showAlert('Please fill in all fields.', 'error');

      loginBtn.disabled = true;
      loginBtn.textContent = 'Signing in…';

      try {
        // Try Firebase client sign-in first
        let idToken = null;
        try {
          const userCred = await signInWithEmailAndPassword(auth, email, password);
          idToken = await userCred.user.getIdToken();
        } catch (firebaseErr) {
          // If not in Firebase yet, fall back to backend local login
        }

        let res;
        if (idToken) {
          res = await fetch('/api/auth/firebase', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'include',
            body: JSON.stringify({ idToken })
          });
        } else {
          res = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'include',
            body: JSON.stringify({ email, password })
          });
        }

        const data = await res.json();
        if (!res.ok) return showAlert(data.message || 'Invalid email or password.', 'error');

        if (window.auth) window.auth.setUser(data.user);
        showAlert('Login successful! Redirecting…', 'success');
        setTimeout(() => window.location.href = 'dashboard.html', 800);
      } catch (err) {
        showAlert('Something went wrong. Please try again.', 'error');
      } finally {
        loginBtn.disabled = false;
        loginBtn.textContent = 'Sign In';
      }
    });
  </script>
</body>
</html>
