<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#121829"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <filter id="boxShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="860" height="480" rx="16" fill="url(#bgGrad)"/>

  <!-- Title & Subtitle -->
  <text x="430" y="42" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" text-anchor="middle" letter-spacing="-0.5">The 4 Deadly Categories of Resume Mistakes</text>
  <text x="430" y="68" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" text-anchor="middle">How automated ATS filters and recruiter scans disqualify 75% of candidate applications</text>

  <!-- 4 Pillars Grid -->
  <g transform="translate(30, 95)">
    <!-- Column 1: Content & Impact -->
    <g transform="translate(0, 0)" filter="url(#boxShadow)">
      <rect width="185" height="240" rx="12" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
      <rect x="14" y="14" width="28" height="28" rx="6" fill="url(#redGrad)"/>
      <text x="28" y="33" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="800" text-anchor="middle">✕</text>
      <text x="50" y="26" fill="#fca5a5" font-family="sans-serif" font-size="10" font-weight="700">CATEGORY 1</text>
      <text x="50" y="40" fill="#ffffff" font-family="sans-serif" font-size="12.5" font-weight="800">Content &amp; Value</text>

      <text x="14" y="74" fill="#cbd5e1" font-family="sans-serif" font-size="11">• Responsibility Trap</text>
      <text x="14" y="98" fill="#cbd5e1" font-family="sans-serif" font-size="11">• Zero Metrics/Data</text>
      <text x="14" y="122" fill="#cbd5e1" font-family="sans-serif" font-size="11">• Generic AI Clichés</text>
      <text x="14" y="146" fill="#cbd5e1" font-family="sans-serif" font-size="11">• Obsolete Objectives</text>

      <rect x="10" y="180" width="165" height="48" rx="6" fill="#450a0a"/>
      <text x="92" y="198" fill="#fca5a5" font-family="sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">THE FIX:</text>
      <text x="92" y="214" fill="#fecaca" font-family="sans-serif" font-size="10" text-anchor="middle">Google X-Y-Z Formula</text>
    </g>

    <!-- Column 2: ATS & Formatting -->
    <g transform="translate(205, 0)" filter="url(#boxShadow)">
      <rect width="185" height="240" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
      <rect x="14" y="14" width="28" height="28" rx="6" fill="url(#amberGrad)"/>
      <text x="28" y="33" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="800" text-anchor="middle">⚠</text>
      <text x="50" y="26" fill="#fde68a" font-family="sans-serif" font-size="10" font-weight="700">CATEGORY 2</text>
      <text x="50" y="40" fill="#ffffff" font-family="sans-serif" font-size="12.5" font-weight="800">ATS Parsing</text>

      <text x="14" y="74" fill="#cbd5e1" font-family="sans-serif" font-size="11">• Dual-Column Tables</text>
      <text x="14" y="98" fill="#cbd5e1" font-family="sans-serif" font-size="11">• Graphics &amp; Icons</text>
      <text x="14" y="122" fill="#cbd5e1" font-family="sans-serif" font-size="11">• Keyword Stuffing</text>
      <text x="14" y="146" fill="#cbd5e1" font-family="sans-serif" font-size="11">• Header/Footer Margins</text>

      <rect x="10" y="180" width="165" height="48" rx="6" fill="#451a03"/>
      <text x="92" y="198" fill="#fde68a" font-family="sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">THE FIX:</text>
      <text x="92" y="214" fill="#fef3c7" font-family="sans-serif" font-size="10" text-anchor="middle">Single-Column Plain Text</text>
    </g>

    <!-- Column 3: Career Architecture -->
    <g transform="translate(410, 0)" filter="url(#boxShadow)">
      <rect width="185" height="240" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
      <rect x="14" y="14" width="28" height="28" rx="6" fill="url(#blueGrad)"/>
      <text x="28" y="33" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="800" text-anchor="middle">⚡</text>
      <text x="50" y="26" fill="#bfdbfe" font-family="sans-serif" font-size="10" font-weight="700">CATEGORY 3</text>
      <text x="50" y="40" fill="#ffffff" font-family="sans-serif" font-size="12.5" font-weight="800">Structure &amp; Gaps</text>

      <text x="14" y="74" fill="#cbd5e1" font-family="sans-serif" font-size="11">• Unexplained Gaps</text>
      <text x="14" y="98" fill="#cbd5e1" font-family="sans-serif" font-size="11">• Chronological-Only</text>
      <text x="14" y="122" fill="#cbd5e1" font-family="sans-serif" font-size="11">• Omitted Remote Tools</text>
      <text x="14" y="146" fill="#cbd5e1" font-family="sans-serif" font-size="11">• Expired/Dead Skills</text>

      <rect x="10" y="180" width="165" height="48" rx="6" fill="#172554"/>
      <text x="92" y="198" fill="#bfdbfe" font-family="sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">THE FIX:</text>
      <text x="92" y="214" fill="#dbeafe" font-family="sans-serif" font-size="10" text-anchor="middle">Skills-First Hybrid Format</text>
    </g>

    <!-- Column 4: Professional Polish -->
    <g transform="translate(615, 0)" filter="url(#boxShadow)">
      <rect width="185" height="240" rx="12" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5"/>
      <rect x="14" y="14" width="28" height="28" rx="6" fill="url(#purpleGrad)"/>
      <text x="28" y="33" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="800" text-anchor="middle">✓</text>
      <text x="50" y="26" fill="#ddd6fe" font-family="sans-serif" font-size="10" font-weight="700">CATEGORY 4</text>
      <text x="50" y="40" fill="#ffffff" font-family="sans-serif" font-size="12.5" font-weight="800">Polish &amp; Verification</text>

      <text x="14" y="74" fill="#cbd5e1" font-family="sans-serif" font-size="11">• Typos &amp; Tense Flips</text>
      <text x="14" y="98" fill="#cbd5e1" font-family="sans-serif" font-size="11">• "References Available"</text>
      <text x="14" y="122" fill="#cbd5e1" font-family="sans-serif" font-size="11">• Private Personal Data</text>
      <text x="14" y="146" fill="#cbd5e1" font-family="sans-serif" font-size="11">• Broken Links / 404s</text>

      <rect x="10" y="180" width="165" height="48" rx="6" fill="#2e1065"/>
      <text x="92" y="198" fill="#ddd6fe" font-family="sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">THE FIX:</text>
      <text x="92" y="214" fill="#ede9fe" font-family="sans-serif" font-size="10" text-anchor="middle">Backward Proofreading</text>
    </g>
  </g>

  <!-- Bottom Comparison Banner -->
  <g transform="translate(30, 360)">
    <rect width="800" height="90" rx="10" fill="#111827" stroke="#334155" stroke-width="1"/>
    <text x="24" y="32" fill="#38bdf8" font-family="sans-serif" font-size="13" font-weight="700">RECRUITER REALITY CHECK:</text>
    <text x="24" y="55" fill="#94a3b8" font-family="sans-serif" font-size="11.5">Average initial scan time: <tspan fill="#ffffff" font-weight="700">6.4 seconds</tspan> • Automated ATS reject rate for formatting errors: <tspan fill="#f87171" font-weight="700">75%</tspan></text>
    <text x="24" y="75" fill="#a5b4fc" font-family="sans-serif" font-size="11.5">Eliminating these 15 errors instantly puts your profile in the top 25% of the candidate pipeline.</text>
  </g>
</svg>
