<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#121829"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="860" height="480" rx="16" fill="url(#bgGrad)"/>

  <!-- Title & Subtitle -->
  <text x="430" y="44" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" text-anchor="middle" letter-spacing="-0.5">High-Impact Resume Bullet Point Architecture</text>
  <text x="430" y="70" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" text-anchor="middle">The Action-Result Model &amp; Google XYZ Formula vs. Common Resume Pitfalls</text>

  <!-- Google XYZ 3-Box Sequence -->
  <g transform="translate(35, 95)">
    <!-- Step X -->
    <g transform="translate(0, 0)" filter="url(#cardShadow)">
      <rect width="240" height="135" rx="12" fill="#1e293b" stroke="#6366f1" stroke-width="1.5"/>
      <rect x="16" y="14" width="30" height="30" rx="8" fill="url(#primaryGrad)"/>
      <text x="31" y="35" fill="#ffffff" font-family="sans-serif" font-size="15" font-weight="800" text-anchor="middle">X</text>
      <text x="56" y="27" fill="#a5b4fc" font-family="sans-serif" font-size="10.5" font-weight="700">ACCOMPLISHMENT</text>
      <text x="56" y="43" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="700">What You Achieved</text>
      <text x="16" y="74" fill="#94a3b8" font-family="sans-serif" font-size="11" line-height="1.4">Lead with strong business outcomes, not mundane duty lists.</text>
      <rect x="16" y="98" width="208" height="24" rx="6" fill="#312e81"/>
      <text x="120" y="114" fill="#c7d2fe" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">"Increased revenue by $50K..."</text>
    </g>

    <!-- Connector 1 -->
    <text x="257" y="75" fill="#6366f1" font-family="sans-serif" font-size="20" font-weight="900" text-anchor="middle">+</text>

    <!-- Step Y -->
    <g transform="translate(275, 0)" filter="url(#cardShadow)">
      <rect width="240" height="135" rx="12" fill="#1e293b" stroke="#06b6d4" stroke-width="1.5"/>
      <rect x="16" y="14" width="30" height="30" rx="8" fill="url(#cyanGrad)"/>
      <text x="31" y="35" fill="#ffffff" font-family="sans-serif" font-size="15" font-weight="800" text-anchor="middle">Y</text>
      <text x="56" y="27" fill="#67e8f9" font-family="sans-serif" font-size="10.5" font-weight="700">MEASUREMENT</text>
      <text x="56" y="43" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="700">How It Was Measured</text>
      <text x="16" y="74" fill="#94a3b8" font-family="sans-serif" font-size="11">Quantify through %, $, hours saved, volume, or team scale.</text>
      <rect x="16" y="98" width="208" height="24" rx="6" fill="#083344"/>
      <text x="120" y="114" fill="#a5f3fc" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">"...representing 25% growth..."</text>
    </g>

    <!-- Connector 2 -->
    <text x="532" y="75" fill="#10b981" font-family="sans-serif" font-size="20" font-weight="900" text-anchor="middle">+</text>

    <!-- Step Z -->
    <g transform="translate(550, 0)" filter="url(#cardShadow)">
      <rect width="240" height="135" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
      <rect x="16" y="14" width="30" height="30" rx="8" fill="url(#emeraldGrad)"/>
      <text x="31" y="35" fill="#ffffff" font-family="sans-serif" font-size="15" font-weight="800" text-anchor="middle">Z</text>
      <text x="56" y="27" fill="#6ee7b7" font-family="sans-serif" font-size="10.5" font-weight="700">METHOD / ACTION</text>
      <text x="56" y="43" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="700">How You Did It</text>
      <text x="16" y="74" fill="#94a3b8" font-family="sans-serif" font-size="11">Highlight technical tools, frameworks, and strategic actions.</text>
      <rect x="16" y="98" width="208" height="24" rx="6" fill="#064e3b"/>
      <text x="120" y="114" fill="#a7f3d0" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">"...by deploying HubSpot CRM"</text>
    </g>
  </g>

  <!-- Comparison Section: The Job Description Trap vs. High-Impact Delivery -->
  <g transform="translate(35, 255)">
    <!-- Header -->
    <text x="395" y="15" fill="#e2e8f0" font-family="sans-serif" font-size="14" font-weight="700" text-anchor="middle">MISTAKE AVOIDANCE: BEFORE VS. AFTER COMPARISON</text>

    <!-- Weak Box -->
    <g transform="translate(0, 30)" filter="url(#cardShadow)">
      <rect width="380" height="160" rx="10" fill="#1e293b" stroke="#ef4444" stroke-width="1.2"/>
      <rect x="16" y="14" width="24" height="24" rx="6" fill="url(#roseGrad)"/>
      <text x="28" y="31" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="800" text-anchor="middle">✕</text>
      <text x="50" y="30" fill="#fca5a5" font-family="sans-serif" font-size="13" font-weight="700">Weak: The Job Description Trap</text>
      
      <text x="18" y="65" fill="#94a3b8" font-family="sans-serif" font-size="11.5">• "Responsible for cold-calling prospective leads."</text>
      <text x="18" y="90" fill="#94a3b8" font-family="sans-serif" font-size="11.5">• "Managed company social media accounts."</text>
      <text x="18" y="115" fill="#94a3b8" font-family="sans-serif" font-size="11.5">• "Wrote code and fixed bug tickets in Jira."</text>
      
      <rect x="16" y="132" width="348" height="20" rx="4" fill="#450a0a"/>
      <text x="190" y="146" fill="#f87171" font-family="sans-serif" font-size="10.5" font-weight="600" text-anchor="middle">Zero metrics • Passive phrasing • Ignored by ATS parsers</text>
    </g>

    <!-- Strong Box -->
    <g transform="translate(410, 30)" filter="url(#cardShadow)">
      <rect width="380" height="160" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1.2"/>
      <rect x="16" y="14" width="24" height="24" rx="6" fill="url(#emeraldGrad)"/>
      <text x="28" y="31" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="800" text-anchor="middle">✓</text>
      <text x="50" y="30" fill="#86efac" font-family="sans-serif" font-size="13" font-weight="700">Strong: Impact-Driven Delivery</text>

      <text x="18" y="65" fill="#cbd5e1" font-family="sans-serif" font-size="11.5">• "Generated $50K MRR by optimizing outbound lead qualification."</text>
      <text x="18" y="90" fill="#cbd5e1" font-family="sans-serif" font-size="11.5">• "Grew organic followers by 25% across 6 months via TikTok strategy."</text>
      <text x="18" y="115" fill="#cbd5e1" font-family="sans-serif" font-size="11.5">• "Decreased latency by 200ms by refactoring legacy Node.js services."</text>

      <rect x="16" y="132" width="348" height="20" rx="4" fill="#064e3b"/>
      <text x="190" y="146" fill="#6ee7b7" font-family="sans-serif" font-size="10.5" font-weight="600" text-anchor="middle">Quantified business value • Active verbs • High ATS rank</text>
    </g>
  </g>
</svg>
